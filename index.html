<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>상품 코드 관리자</title>
</head>
<body>

<h2>상품 등록</h2>

<input id="category" placeholder="카테고리"><br>
<input id="product" placeholder="제품"><br>
<input id="material" placeholder="재질"><br>
<input id="shape" placeholder="세부형태"><br>
<input id="user" placeholder="작성자"><br>

<button onclick="save()">저장</button>

<hr>

<h2>상품 목록</h2>
<button onclick="load()">불러오기</button>
<pre id="result"></pre>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxOPUay5CPExv-jb0hFk_tms5OYsscokIh-Ij6dnfvBWeh5hVDH3kmlRAABr5BtRIdJWA/exec";

async function load() {
  try {
    const res = await fetch(API_URL + "?action=list");
    const data = await res.json();
    document.getElementById("result").innerText = JSON.stringify(data, null, 2);
  } catch (err) {
    console.error(err);
    alert("불러오기 실패");
  }
}

async function save() {
  const data = {
    action: "create",
    카테고리: document.getElementById("category").value || "",
    제품: document.getElementById("product").value || "",
    재질: document.getElementById("material").value || "",
    세부형태: document.getElementById("shape").value || "",
    수정자: document.getElementById("user").value || "unknown",
    사용여부: "Y"
  };

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },
      body: JSON.stringify(data)
    });

    const result = await res.json();
    console.log("save result:", result);

    if (result.success) {
      alert("저장 완료");
      load();
    } else {
      alert("저장 실패: " + JSON.stringify(result));
    }
  } catch (err) {
    console.error(err);
    alert("저장 중 오류 발생");
  }
}
</script>

</body>
</html>
