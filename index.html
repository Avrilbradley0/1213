<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>상품 코드 관리자</title>
</head>
<body>

<h2>상품 등록</h2>

<input id="category" placeholder="카테고리"><br>
<input id="product" placeholder="제품"><br>
<input id="material" placeholder="재질"><br>
<input id="shape" placeholder="세부형태"><br>
<input id="user" placeholder="작성자"><br>

<button onclick="save()">저장</button>

<hr>

<h2>상품 목록</h2>
<button onclick="load()">불러오기</button>
<pre id="result"></pre>

<script>
const API_URL = "여기에_너_URL_붙여";

function load() {
  fetch(API_URL + "?action=list")
    .then(res => res.json())
    .then(data => {
      document.getElementById("result").innerText =
        JSON.stringify(data, null, 2);
    });
}

function save() {
  const data = {
    action: "create",
    카테고리: document.getElementById("category").value,
    제품: document.getElementById("product").value,
    재질: document.getElementById("material").value,
    세부형태: document.getElementById("shape").value,
    수정자: document.getElementById("user").value,
    사용여부: "Y"
  };

  fetch(API_URL, {
    method: "POST",
    body: JSON.stringify(data)
  })
  .then(res => res.json())
  .then(res => {
    alert("저장 완료");
    load();
  });
}
</script>

</body>
</html>
