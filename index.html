<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HUSK 코드 매니저</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Pretendard", "Noto Sans KR", sans-serif;
      background: #f5f5f7;
      color: #111;
    }

    .wrap {
      max-width: 1280px;
      margin: 0 auto;
      padding: 40px 28px 80px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 28px;
    }

    .title {
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin: 0 0 10px;
    }

    .desc {
      margin: 0;
      font-size: 17px;
      color: #666;
      line-height: 1.6;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 126px;
      justify-content: center;
      padding: 14px 18px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid #e5e5e5;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
      white-space: nowrap;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #bdbdbd;
      flex: 0 0 auto;
    }

    .status-text {
      font-size: 16px;
      font-weight: 600;
      color: #333;
    }

    .panel {
      background: #fff;
      border: 1px solid #e9e9e9;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.03);
    }

    .panel h2 {
      margin: 0 0 8px;
      font-size: 24px;
      letter-spacing: -0.02em;
    }

    .panel p {
      margin: 0 0 20px;
      color: #666;
      line-height: 1.6;
    }

    .code-box {
      padding: 16px 18px;
      background: #f8f8f8;
      border: 1px solid #ececec;
      border-radius: 16px;
      font-family: Consolas, monospace;
      font-size: 14px;
      color: #333;
      word-break: break-all;
      margin-bottom: 16px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      appearance: none;
      border: 1px solid #d9d9d9;
      background: #fff;
      color: #111;
      padding: 12px 18px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #f7f7f7;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <h1 class="title">HUSK 코드 매니저</h1>
        <p class="desc">상품 관리, 약어 관리, 코드 생성을 한 화면에서 정리하는 연동형 관리자</p>
      </div>

      <div class="status-badge" id="connectionBadge">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-text" id="statusText">확인 중</span>
      </div>
    </div>

    <div class="panel">
      <h2>연동 상태</h2>
      <p>HTML 안에 고정된 Apps Script 배포 URL 기준으로 연결 가능 여부만 확인한다.</p>

      <div class="code-box" id="scriptUrlText"></div>

      <div class="actions">
        <button type="button" onclick="checkConnection()">다시 확인</button>
      </div>
    </div>
  </div>
 
  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxrhQDDWClVYSl0lVYzolK04AgxsZtZgz3hZoCzzF_M5vYQ8iITj-u205N3lH5qPeG0/exec";

    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const scriptUrlText = document.getElementById("scriptUrlText");

    scriptUrlText.textContent = SCRIPT_URL;

    async function checkConnection() {
      statusDot.style.background = "#bdbdbd";
      statusText.textContent = "확인 중";

      try {
        const res = await fetch(SCRIPT_URL, {
          method: "GET",
          cache: "no-store"
        });

        if (!res.ok) {
          throw new Error("HTTP " + res.status);
        }

        statusDot.style.background = "#2e7d32";
        statusText.textContent = "연결됨";
      } catch (err) {
        statusDot.style.background = "#c62828";
        statusText.textContent = "연결 안 됨";
        console.error("연결 확인 실패:", err);
      }
    }

    window.addEventListener("load", checkConnection);
  </script>
</body>
</html>
