<!DOCTYPE html>
<html lang="ko">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   HUSK 코드 매니저
  </title>
  <style>
   *{box-sizing:border-box}body{margin:0;font-family:Pretendard,'Noto Sans KR',sans-serif;background:#f3f4f6;color:#111827}.wrap{max-width:1280px;margin:0 auto;padding:32px 24px 72px}.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px}.title{margin:0;font-size:32px;font-weight:800}.desc{margin:10px 0 0;color:#6b7280}.status-badge{display:inline-flex;align-items:center;gap:9px;padding:12px 18px;background:#fff;border:1px solid #e5e7eb;border-radius:999px}.status-dot{width:9px;height:9px;border-radius:50%;background:#9ca3af}.tabs{display:inline-flex;background:#eceff3;border:1px solid #e5e7eb;border-radius:999px;padding:4px;gap:4px;margin-bottom:20px}.tab-btn{border:0;background:transparent;padding:12px 20px;border-radius:999px;font-weight:700;cursor:pointer}.tab-btn.active{background:#fff}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:22px}.card-label{margin:0 0 10px;color:#6b7280;font-size:14px}.card-value{margin:0;font-size:30px;font-weight:800}.tab-panel{display:none}.tab-panel.active{display:block}.grid-2{display:grid;grid-template-columns:1fr 1.25fr;gap:18px}.section-title{margin:0 0 6px;font-size:20px;font-weight:800}.section-desc{margin:0 0 18px;color:#6b7280;font-size:14px}.field{margin-bottom:14px}.field label{display:block;margin-bottom:7px;font-size:14px;font-weight:700}.input,.select,.textarea{width:100%;border:1px solid #d1d5db;background:#fff;border-radius:14px;padding:13px 14px;font-size:15px}.textarea{min-height:110px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.btn{border:1px solid #d1d5db;background:#fff;border-radius:14px;padding:12px 16px;font-size:14px;font-weight:700;cursor:pointer}.btn.primary{background:#111827;color:#fff;border-color:#111827}.preview-box{background:#f9fafb;border:1px dashed #d1d5db;border-radius:18px;padding:16px}.preview-item{margin-bottom:12px}.preview-label{color:#6b7280;font-size:13px}.preview-value{font-size:18px;font-weight:800;word-break:break-all}.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.toolbar .input,.toolbar .select{flex:1 1 220px}table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e5e7eb;border-radius:18px;overflow:hidden}th,td{border-bottom:1px solid #e5e7eb;padding:14px 12px;text-align:left;font-size:14px}th{background:#fafafa;color:#4b5563;font-weight:700}tr:last-child td{border-bottom:0}.empty{padding:24px 12px;color:#6b7280;text-align:center}.small-btn{border:1px solid #d1d5db;background:#fff;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:700;cursor:pointer;margin-right:6px;margin-bottom:6px}@media(max-width:1024px){.grid-2,.cards{grid-template-columns:1fr}}@media(max-width:720px){.topbar{flex-direction:column}.row{grid-template-columns:1fr}}
  </style>
 </head>
 <body>
  <div class="wrap">
   <div class="topbar">
    <div>
     <h1 class="title">
      HUSK 코드 매니저
     </h1>
    </div>
    <div class="status-badge">
     <span class="status-dot" id="statusDot">
     </span>
     <span id="statusText">
      확인 중
     </span>
    </div>
   </div>
   <div class="tabs">
    <button class="tab-btn active" data-tab="code">
     코드 생성
    </button>
    <button class="tab-btn" data-tab="product">
     상품 관리
    </button>
    <button class="tab-btn" data-tab="abbr">
     약어 관리
    </button>
   </div>
   <div class="cards">
    <div class="card">
     <p class="card-label">
      현재 등록 상품
     </p>
     <p class="card-value" id="productCount">
      0
     </p>
    </div>
    <div class="card">
     <p class="card-label">
      현재 등록 약어
     </p>
     <p class="card-value" id="abbrCount">
      0
     </p>
    </div>
    <div class="card">
     <p class="card-label">
      현재 상태
     </p>
     <p class="card-value" id="connectLabel">
      대기 중
     </p>
    </div>
   </div>
   <section class="tab-panel active" id="tab-code">
    <div class="grid-2">
     <div class="card">
      <h2 class="section-title">
       코드 생성
      </h2>
      <p class="section-desc">
       유형이 자유형이면 FE_ + 기본코드 형식으로 생성된다.
      </p>
      <div class="row">
       <div class="field">
        <label>
         유형
        </label>
        <select class="select" id="cgType">
        </select>
       </div>
       <div class="field">
        <label>
         라인
        </label>
        <select class="select" id="cgLine">
        </select>
       </div>
      </div>
      <div class="row">
       <div class="field">
        <label>
         재질
        </label>
        <select class="select" id="cgMaterial">
        </select>
       </div>
       <div class="field">
        <label>
         형태
        </label>
        <select class="select" id="cgStructure">
        </select>
       </div>
      </div>
      <div class="row">
       <div class="field">
        <label>
         컬러
        </label>
        <select class="select" id="cgColor">
        </select>
       </div>
       <div class="field">
        <label>
         마감
        </label>
        <select class="select" id="cgFinish">
        </select>
       </div>
      </div>
      <div class="row">
       <div class="field">
        <label>
         인쇄
        </label>
        <select class="select" id="cgLamination">
        </select>
       </div>
       <div class="field">
        <label>
         면 구분
        </label>
        <select class="select" id="cgSide">
        </select>
       </div>
      </div>
      <div class="field">
       <label>
        상품명
       </label>
       <select class="select" id="cgProduct">
       </select>
      </div>
      <div class="actions">
       <button class="btn primary" onclick="generateCode()">
        코드 생성
       </button>
       <button class="btn" onclick="resetCodeForm()">
        초기화
       </button>
      </div>
     </div>
     <div class="card">
      <h2 class="section-title">
       생성 결과
      </h2>
      <p class="section-desc">
       예: FE_MGPCBPWH_GL_LM_S1
      </p>
      <div class="preview-box">
       <div class="preview-item">
        <div class="preview-label">
         제품 코드
        </div>
        <div class="preview-value" id="pvCode">
         -
        </div>
       </div>
       <div class="preview-item">
        <div class="preview-label">
         썸네일 파일명
        </div>
        <div class="preview-value" id="pvThumb">
         -
        </div>
       </div>
       <div class="preview-item">
        <div class="preview-label">
         스토어용 파일명
        </div>
        <div class="preview-value" id="pvStore">
         -
        </div>
       </div>
       <div class="preview-item">
        <div class="preview-label">
         캐러셀 파일명
        </div>
        <div class="preview-value" id="pvCarousel">
         -
        </div>
       </div>
      </div>
      <div class="actions">
       <button class="btn" onclick="copyText('pvCode')">
        제품 코드 복사
       </button>
       <button class="btn" onclick="copyText('pvThumb')">
        썸네일명 복사
       </button>
       <button class="btn" onclick="copyText('pvStore')">
        스토어명 복사
       </button>
       <button class="btn" onclick="copyText('pvCarousel')">
        캐러셀명 복사
       </button>
      </div>
     </div>
    </div>
   </section>
   <section class="tab-panel" id="tab-product">
    <div class="grid-2">
     <div class="card">
      <h2 class="section-title">
       상품 등록
      </h2>
      <div class="field">
       <label>
        상품명
       </label>
       <input class="input" id="pName"/>
      </div>
      <div class="row">
       <div class="field">
        <label>
         유형
        </label>
        <input class="input" id="pType" placeholder="일반 / 자유형"/>
       </div>
       <div class="field">
        <label>
         라인
        </label>
        <input class="input" id="pLine"/>
       </div>
      </div>
      <div class="row">
       <div class="field">
        <label>
         재질
        </label>
        <input class="input" id="pMaterial"/>
       </div>
       <div class="field">
        <label>
         형태
        </label>
        <input class="input" id="pStructure"/>
       </div>
      </div>
      <div class="row">
       <div class="field">
        <label>
         마감
        </label>
        <input class="input" id="pFinish"/>
       </div>
       <div class="field">
        <label>
         비고
        </label>
        <textarea class="textarea" id="pNote"></textarea>
       </div>
      </div>
      <div class="actions">
       <button class="btn primary" onclick="saveProduct()">
        상품 저장
       </button>
       <button class="btn" onclick="resetProductForm()">
        취소
       </button>
      </div>
     </div>
     <div class="card">
      <h2 class="section-title">
       상품 목록
      </h2>
      <div class="toolbar">
       <input class="input" id="productSearch" oninput="renderProducts()" placeholder="상품명 검색"/>
      </div>
      <table>
       <thead>
        <tr>
         <th>
          상품명
         </th>
         <th>
          유형 / 라인
         </th>
         <th>
          재질 / 형태
         </th>
         <th>
          마감 / 비고
         </th>
         <th>
          작업
         </th>
        </tr>
       </thead>
       <tbody id="productTable">
       </tbody>
      </table>
     </div>
    </div>
   </section>
   <section class="tab-panel" id="tab-abbr">
    <div class="grid-2">
     <div class="card">
      <h2 class="section-title">
       약어 등록
      </h2>
      <div class="row">
       <div class="field">
        <label>
         구분
        </label>
        <select class="select" id="aCategory">
        </select>
       </div>
       <div class="field">
        <label>
         코드
        </label>
        <input class="input" id="aCode"/>
       </div>
      </div>
      <div class="field">
       <label>
        한글명
       </label>
       <input class="input" id="aName"/>
      </div>
      <div class="field">
       <label>
        비고
       </label>
       <textarea class="textarea" id="aNote"></textarea>
      </div>
      <div class="actions">
       <button class="btn primary" onclick="saveAbbr()">
        약어 저장
       </button>
       <button class="btn" onclick="resetAbbrForm()">
        취소
       </button>
      </div>
     </div>
     <div class="card">
      <h2 class="section-title">
       약어 목록
      </h2>
      <div class="toolbar">
       <input class="input" id="abbrSearch" oninput="renderAbbrs()" placeholder="한글명 / 코드 검색"/>
       <select class="select" id="abbrFilter" onchange="renderAbbrs()">
       </select>
      </div>
      <table>
       <thead>
        <tr>
         <th>
          구분
         </th>
         <th>
          코드
         </th>
         <th>
          한글명
         </th>
         <th>
          비고
         </th>
         <th>
          작업
         </th>
        </tr>
       </thead>
       <tbody id="abbrTable">
       </tbody>
      </table>
     </div>
    </div>
   </section>
  </div>
  <script>
   const SCRIPT_URL="https://script.google.com/macros/s/AKfycbwvpTA7MwrwRfyJPoJiNQALs_0gWkoFX9xQknWx5yVWyzqI45n62VOwbVFUxgGQ2gWk/exec";
 const categoryLabelMap= {  type:"유형", line:"라인", material:"재질", structure:"형태", product:"상품", finish:"마감", color:"컬러", lamination:"인쇄", side:"면 구분"}; const state= {  products:[], abbrs:[], editingProductId:null, editingAbbrId:null}; function setConnection(s) {  const ok=s==="ok";  if (s==="loading") {    statusDot.style.background="#9ca3af";    statusText.textContent="확인 중";    connectLabel.textContent="대기 중";    return;      }  statusDot.style.background=ok?"#16a34a":"#dc2626";  statusText.textContent=ok?"연결됨":"연결 안 됨";  connectLabel.textContent=ok?"연결됨":"연결 안 됨";  } function bindTabs() {  document.querySelectorAll(".tab-btn").forEach(b=>b.onclick=()=> {    document.querySelectorAll(".tab-btn").forEach(x=>x.classList.remove("active"));    document.querySelectorAll(".tab-panel").forEach(x=>x.classList.remove("active"));    b.classList.add("active");    document.getElementById("tab-"+b.dataset.tab).classList.add("active")  })} function fillCategorySelects() {  const cats=["type", "line", "material", "structure", "product", "finish", "color", "lamination", "side"];  aCategory.innerHTML=cats.map(c=>`<option value="${c}">${categoryLabelMap[c]}</option>`).join("");  abbrFilter.innerHTML='<option value="">전체 구분</option>'+cats.map(c=>`<option value="${c}">${categoryLabelMap[c]}</option>`).join("")} function esc(v) {  return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;  ","<":"&lt;  ",">":"&gt;  ",'"':"&quot;","'":"&#39;  "}[m]))}
function sortRows(rows){const o={type:0,line:1,material:2,structure:3,product:4,finish:5,color:6,lamination:7,side:8};return [...rows].sort((a,b)=>(o[a.category]??99)-(o[b.category]??99)||String(a.name||"").localeCompare(String(b.name||""),"ko"))}
function getAbbrOptions(cat){return sortRows(state.abbrs.filter(i=>i.category===cat&&String(i.use_yn||"Y")!=="N"))}
function fillCodeGeneratorSelects(){const map={cgType:"type",cgLine:"line",cgMaterial:"material",cgStructure:"structure",cgColor:"color",cgFinish:"finish",cgLamination:"lamination",cgSide:"side"};Object.entries(map).forEach(([id,cat])=>{const el=document.getElementById(id),opts=getAbbrOptions(cat);el.innerHTML=opts.map(i=>`<option value="$ {    esc((i.code||"").trim())  }  ">${esc((i.code||"").trim()?`${i.name} (${i.code})`:i.name)}</option>`).join("")||'<option value="">선택</option>'});cgProduct.innerHTML='<option value="">선택</option>'+state.products.map(i=>`<option value="$ {    esc(i.id)  }  ">${esc(i.name)}</option>`).join("")}
function updateCounts(){productCount.textContent=state.products.length;abbrCount.textContent=state.abbrs.length}
function renderProducts(){const k=productSearch.value.trim().toLowerCase(),rows=state.products.filter(i=>!k||[i.name,i.type,i.line,i.material,i.structure,i.finish,i.note].join(" ").toLowerCase().includes(k));productTable.innerHTML=rows.length?rows.map(i=>`<tr><td><strong>${esc(i.name)}</strong></td><td>${esc(i.type||"-")}<div style="color:#6b7280;  font-size:13px">${esc(i.line||"-")}</div></td><td>${esc(i.material||"-")}<div style="color:#6b7280;  font-size:13px">${esc(i.structure||"-")}</div></td><td>${esc(i.finish||"-")}<div style="color:#6b7280;  font-size:13px">${esc(i.note||"-")}</div></td><td><button class="small-btn" onclick="editProduct('${esc(i.id)}')">수정</button><button class="small-btn" onclick="deleteProduct('${esc(i.id)}')">삭제</button></td></tr>`).join(""):`<tr><td colspan="5" class="empty">등록된 상품이 없습니다.</td></tr>`}
function renderAbbrs(){const k=abbrSearch.value.trim().toLowerCase(),f=abbrFilter.value,rows=sortRows(state.abbrs.filter(i=>(!f||i.category===f)&&(!k||[i.category,i.code,i.name,i.note].join(" ").toLowerCase().includes(k))));abbrTable.innerHTML=rows.length?rows.map(i=>`<tr><td>${categoryLabelMap[i.category]||i.category}</td><td><strong>${esc(i.code||"-")}</strong></td><td>${esc(i.name)}</td><td>${esc(i.note||"-")}</td><td><button class="small-btn" onclick="editAbbr('${esc(i.id)}')">수정</button><button class="small-btn" onclick="deleteAbbr('${esc(i.id)}')">삭제</button></td></tr>`).join(""):`<tr><td colspan="5" class="empty">등록된 약어가 없습니다.</td></tr>`}
async function requestJSON(url,options={}){const r=await fetch(url,options);if (!r.ok)throw new Error("HTTP "+r.status);return await r.json()}
async function loadAllFromSheet(){const r=await requestJSON(`${SCRIPT_URL}?action=getAll&ts=${Date.now()}`,{method:"GET",cache:"no-store"});if (!r.success)throw new Error(r.message||"데이터 불러오기 실패");state.abbrs=Array.isArray(r.data?.codes)?r.data.codes:[];state.products=Array.isArray(r.data?.products)?r.data.products:[];fillCodeGeneratorSelects();renderProducts();renderAbbrs();updateCounts();setConnection("ok")}
async function postJSON(payload){const r=await requestJSON(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;  charset=utf-8"},body:JSON.stringify(payload),cache:"no-store"});if (!r.success)throw new Error(r.message||"저장 실패");return r}
async function saveProduct(){const d={id:state.editingProductId||"",name:pName.value.trim(),type:pType.value.trim(),line:pLine.value.trim(),material:pMaterial.value.trim(),structure:pStructure.value.trim(),finish:pFinish.value.trim(),note:pNote.value.trim(),use_yn:"Y"};if (!d.name){alert("상품명을 입력해 주세요.");return}try{await postJSON({action:"saveProduct",...d});alert("시트에 반영되었습니다.");state.editingProductId=null;resetProductForm(false);await loadAllFromSheet()}catch(e){alert("저장 중 오류가 발생했습니다: "+e.message)}}
function editProduct(id){const i=state.products.find(r=>String(r.id)===String(id));if (!i)return;state.editingProductId=id;pName.value=i.name||"";pType.value=i.type||"";pLine.value=i.line||"";pMaterial.value=i.material||"";pStructure.value=i.structure||"";pFinish.value=i.finish||"";pNote.value=i.note||""}
async function deleteProduct(id){if (!confirm("이 상품을 삭제하시겠습니까?"))return;try{await postJSON({action:"deleteProduct",id});alert("시트에 반영되었습니다.");await loadAllFromSheet()}catch(e){alert("삭제 중 오류가 발생했습니다: "+e.message)}}
function resetProductForm(clear=true){if (clear)state.editingProductId=null;["pName","pType","pLine","pMaterial","pStructure","pFinish","pNote"].forEach(id=>document.getElementById(id).value="")}
async function saveAbbr(){const d={id:state.editingAbbrId||"",category:aCategory.value,code:aCode.value.trim().toUpperCase(),name:aName.value.trim(),note:aNote.value.trim(),use_yn:"Y"};if (!d.category||!d.name){alert("구분과 한글명을 입력해 주세요.");return}try{await postJSON({action:"saveCode",...d});alert("시트에 반영되었습니다.");state.editingAbbrId=null;resetAbbrForm(false);await loadAllFromSheet()}catch(e){alert("저장 중 오류가 발생했습니다: "+e.message)}}
function editAbbr(id){const i=state.abbrs.find(r=>String(r.id)===String(id));if (!i)return;state.editingAbbrId=id;aCategory.value=i.category||"type";aCode.value=i.code||"";aName.value=i.name||"";aNote.value=i.note||""}
async function deleteAbbr(id){if (!confirm("이 약어를 삭제하시겠습니까?"))return;try{await postJSON({action:"deleteCode",id});alert("시트에 반영되었습니다.");await loadAllFromSheet()}catch(e){alert("삭제 중 오류가 발생했습니다: "+e.message)}}
function resetAbbrForm(clear=true){if (clear)state.editingAbbrId=null;aCategory.value="type";aCode.value="";aName.value="";aNote.value=""}
function generateCode(){const typeCode=cgType.value||"",base=[cgLine.value||"",cgMaterial.value||"",cgStructure.value||"",cgColor.value||""].filter(Boolean).join(""),extra=[cgFinish.value||"",cgLamination.value||"",cgSide.value||""].filter(Boolean);if (!base&&!extra.length){alert("코드 생성에 필요한 항목을 선택해 주세요.");return}const prefix=typeCode?typeCode+"_":"";const code=prefix+base+(extra.length?"_"+extra.join("_"):"");pvCode.textContent=code;pvThumb.textContent=`${code}_T_01`;pvStore.textContent=`${code}_T_01_STORE`;pvCarousel.textContent=`${code}_C_01`}
function resetCodeForm(){["cgType","cgLine","cgMaterial","cgStructure","cgColor","cgFinish","cgLamination","cgSide","cgProduct"].forEach(id=>document.getElementById(id).selectedIndex=0);["pvCode","pvThumb","pvStore","pvCarousel"].forEach(id=>document.getElementById(id).textContent="-")}
async function copyText(id){const v=document.getElementById(id).textContent.trim();if (!v||v==="-")return;try{await navigator.clipboard.writeText(v)}catch(e){}}
async function init(){document.querySelectorAll(".tab-btn").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab-btn").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".tab-panel").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.getElementById("tab-"+b.dataset.tab).classList.add("active")});fillCategorySelects();setConnection("loading");try{await loadAllFromSheet()}catch(e){console.error(e);setConnection("fail");alert("시트 데이터를 불러오지 못했습니다. Apps Script를 새 파일로 교체한 뒤 수정 배포해 주세요.")}}
window.addEventListener("load",init);
  </script>
