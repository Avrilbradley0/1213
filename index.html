<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>코드 매니저 - 타입 구조 확장판</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#1f2937}
  .wrap{max-width:1320px;margin:0 auto;padding:24px}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
  .title{font-size:24px;font-weight:700}
  .status{font-size:13px;padding:6px 10px;border-radius:999px;background:#eef2ff;color:#4338ca}
  .layout{display:grid;grid-template-columns:380px 1fr;gap:20px}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;box-shadow:0 4px 18px rgba(15,23,42,.05)}
  .card h2{margin:0 0 14px;font-size:18px}
  .field{margin-bottom:12px}
  .field label{display:block;margin-bottom:6px;font-size:13px;font-weight:700;color:#374151}
  .field input,.field select,.toolbar input{
    width:100%;height:42px;padding:0 12px;border:1px solid #d1d5db;border-radius:10px;background:#fff;font-size:14px
  }
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .preview{
    margin-top:8px;padding:12px;border-radius:12px;background:#111827;color:#22c55e;
    font-family:Consolas,monospace;font-size:14px;min-height:48px;display:flex;align-items:center;white-space:pre-wrap
  }
  .thumbbox{background:#f8fafc;border:1px solid #e5e7eb;border-radius:12px;padding:12px;font-family:Consolas,monospace;font-size:13px;white-space:pre-wrap}
  .actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  button{border:none;border-radius:10px;height:42px;padding:0 14px;font-size:14px;font-weight:700;cursor:pointer}
  .btn-primary{background:#111827;color:#fff;flex:1}
  .btn-light{background:#eef2ff;color:#3730a3}
  .btn-danger{background:#fee2e2;color:#b91c1c}
  .btn-green{background:#dcfce7;color:#166534}
  .toolbar{display:flex;gap:10px;margin-bottom:14px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .tab{padding:8px 12px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:13px;font-weight:700;cursor:pointer}
  .tab.active{background:#111827;color:#fff}
  .empty{padding:28px;border:1px dashed #cbd5e1;border-radius:14px;text-align:center;color:#64748b;background:#f8fafc}
  .table-wrap{overflow:auto}
  table{width:100%;border-collapse:collapse}
  th,td{padding:12px 10px;border-bottom:1px solid #eef2f7;font-size:13px;text-align:left;white-space:nowrap}
  th{font-size:12px;color:#6b7280;background:#fafafa;position:sticky;top:0}
  .muted{color:#6b7280}
  .clickable-row{cursor:pointer}
  .clickable-row:hover{background:#f8fafc}
  .split{display:grid;grid-template-columns:1fr;gap:20px}
  @media (max-width: 1080px){ .layout{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="title">코드 매니저 - 타입 구조 확장판</div>
    <div class="status" id="statusBadge">연결 대기</div>
  </div>

  <div class="layout">
    <div class="card">
      <h2>상품 등록 / 수정</h2>
      <div class="field"><label for="id">상품 ID</label><input id="id" placeholder="수정 시 자동 입력됨" /></div>
      <div class="field"><label for="카테고리">카테고리</label><input id="카테고리" placeholder="예: 케이스 / 굿즈" /></div>
      <div class="field"><label for="라인">라인</label><select id="라인"></select></div>
      <div class="field"><label for="타입">타입</label><select id="타입"></select></div>
      <div class="field"><label for="컬러">컬러</label><select id="컬러"></select></div>

      <div class="row2">
        <div class="field"><label for="라미">라미</label><select id="라미"></select></div>
        <div class="field"><label for="면">면</label><select id="면"></select></div>
      </div>

      <div class="field">
        <label>코드 미리보기</label>
        <div class="preview" id="previewBox">항목을 선택하면 코드가 보여</div>
      </div>

      <div class="field">
        <label>썸네일 / 캐러셀 자동생성</label>
        <div class="thumbbox" id="thumbBox">코드가 생성되면 여기 표시됨</div>
      </div>

      <div class="actions">
        <button class="btn-light" id="copyCodeBtn" type="button">코드 복사</button>
        <button class="btn-green" id="copyThumbBtn" type="button">썸네일 복사</button>
      </div>
      <div class="actions">
        <button class="btn-primary" id="saveBtn" type="button">저장</button>
        <button class="btn-light" id="updateBtn" type="button">수정</button>
        <button class="btn-danger" id="deleteBtn" type="button">삭제</button>
      </div>
      <div class="actions">
        <button class="btn-light" id="resetBtn" type="button">입력 초기화</button>
      </div>
    </div>

    <div class="split">
      <div class="card">
        <h2>약어 목록</h2>
        <div class="toolbar">
          <input id="searchInput" placeholder="구분 / 한글명 / 코드 / 조회키 검색" />
          <button class="btn-light" id="reloadBtn" type="button">새로고침</button>
        </div>
        <div class="tabs" id="groupTabs"></div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>구분</th><th>한글명</th><th>코드</th><th>조회키</th></tr>
            </thead>
            <tbody id="codeTableBody"></tbody>
          </table>
        </div>
        <div class="empty" id="codeEmptyBox" style="display:none;">표시할 약어가 없어</div>
      </div>

      <div class="card">
        <h2>상품 목록</h2>
        <div class="toolbar">
          <input id="productSearchInput" placeholder="상품코드 / 파생코드 / 카테고리 검색" />
          <button class="btn-light" id="reloadProductsBtn" type="button">상품 새로고침</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>ID</th><th>카테고리</th><th>제품코드</th><th>파생코드</th><th>사용여부</th></tr>
            </thead>
            <tbody id="productTableBody"></tbody>
          </table>
        </div>
        <div class="empty" id="productEmptyBox" style="display:none;">표시할 상품이 없어</div>
      </div>
    </div>
  </div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbyP5oLO3aePdP8sbga0m8h_6SbubwY_S4r5wFp6RnTErLasycmVXbKYQEuUxI0q1DmNgw/exec";
const GROUP_ORDER = ["라인","타입","컬러","라미","면"];
const state = { codeMap: [], products: [], activeGroup: "전체", previewCode: "" };

function setStatus(text, ok=false){
  const el = document.getElementById("statusBadge");
  el.textContent = text;
  el.style.background = ok ? "#dcfce7" : "#eef2ff";
  el.style.color = ok ? "#166534" : "#4338ca";
}
function safeText(v){ return String(v == null ? "" : v).trim(); }
function escapeHtml(str){ return safeText(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[m])); }
function getCodeMapByGroup(group){ return state.codeMap.filter(row => safeText(row.구분) === group && safeText(row.사용여부 || "Y") !== "N"); }
function fillSelect(id, rows){
  const el = document.getElementById(id);
  el.innerHTML = "";
  const base = document.createElement("option");
  base.value = "";
  base.textContent = "선택";
  el.appendChild(base);
  rows.sort((a,b) => Number(a.정렬 || 9999) - Number(b.정렬 || 9999) || safeText(a.한글명).localeCompare(safeText(b.한글명), "ko"));
  rows.forEach(row => {
    const opt = document.createElement("option");
    opt.value = safeText(row.한글명);
    opt.textContent = safeText(row.한글명);
    el.appendChild(opt);
  });
}
function buildSelects(){ GROUP_ORDER.forEach(group => fillSelect(group, getCodeMapByGroup(group))); }
function codeFrom(group, label){
  const row = state.codeMap.find(r => safeText(r.구분) === group && safeText(r.한글명) === safeText(label) && safeText(r.사용여부 || "Y") !== "N");
  return row ? safeText(row.코드) : "";
}
function thumbStrings(code){ return code ? [code+"_T_01", code+"_T_02", code+"_C_01", code+"_C_02"] : []; }
function buildPreviewCode(){
  state.previewCode = [
    codeFrom("라인", valueOf("라인")),
    codeFrom("타입", valueOf("타입")),
    codeFrom("컬러", valueOf("컬러")),
    codeFrom("라미", valueOf("라미")),
    codeFrom("면", valueOf("면"))
  ].filter(Boolean).join("");
  document.getElementById("previewBox").textContent = state.previewCode || "항목을 선택하면 코드가 보여";
  document.getElementById("thumbBox").textContent = state.previewCode ? thumbStrings(state.previewCode).join("\n") : "코드가 생성되면 여기 표시됨";
}
function buildTabs(){
  const wrap = document.getElementById("groupTabs");
  const groups = ["전체", ...GROUP_ORDER.filter(g => getCodeMapByGroup(g).length > 0)];
  wrap.innerHTML = "";
  groups.forEach(group => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "tab" + (state.activeGroup === group ? " active" : "");
    btn.textContent = group;
    btn.addEventListener("click", () => { state.activeGroup = group; buildTabs(); renderCodeTable(); });
    wrap.appendChild(btn);
  });
}
function renderCodeTable(){
  const q = safeText(document.getElementById("searchInput").value).toLowerCase();
  const body = document.getElementById("codeTableBody");
  const empty = document.getElementById("codeEmptyBox");
  let rows = state.codeMap.filter(row => safeText(row.사용여부 || "Y") !== "N");
  if(state.activeGroup !== "전체") rows = rows.filter(row => safeText(row.구분) === state.activeGroup);
  if(q) rows = rows.filter(row => [row.구분, row.한글명, row.코드, row.조회키].join(" ").toLowerCase().includes(q));
  rows.sort((a,b) => {
    const ga = GROUP_ORDER.indexOf(safeText(a.구분));
    const gb = GROUP_ORDER.indexOf(safeText(b.구분));
    if(ga !== gb) return ga - gb;
    return Number(a.정렬 || 9999) - Number(b.정렬 || 9999);
  });
  body.innerHTML = "";
  if(!rows.length){ empty.style.display = ""; return; }
  empty.style.display = "none";
  rows.forEach(row => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${escapeHtml(row.구분)}</td><td>${escapeHtml(row.한글명)}</td><td><strong>${escapeHtml(row.코드)}</strong></td><td class="muted">${escapeHtml(row.조회키)}</td>`;
    body.appendChild(tr);
  });
}
function renderProductTable(){
  const q = safeText(document.getElementById("productSearchInput").value).toLowerCase();
  const body = document.getElementById("productTableBody");
  const empty = document.getElementById("productEmptyBox");
  let rows = state.products.slice();
  if(q) rows = rows.filter(row => [row.id, row.카테고리, row.제품코드, row.파생코드].join(" ").toLowerCase().includes(q));
  body.innerHTML = "";
  if(!rows.length){ empty.style.display = ""; return; }
  empty.style.display = "none";
  rows.forEach(row => {
    const tr = document.createElement("tr");
    tr.className = "clickable-row";
    tr.innerHTML = `<td>${escapeHtml(row.id)}</td><td>${escapeHtml(row.카테고리)}</td><td><strong>${escapeHtml(row.제품코드)}</strong></td><td>${escapeHtml(row.파생코드)}</td><td>${escapeHtml(row.사용여부 || "Y")}</td>`;
    tr.addEventListener("click", () => loadProductToForm(row));
    body.appendChild(tr);
  });
}
function loadProductToForm(row){
  document.getElementById("id").value = safeText(row.id);
  document.getElementById("카테고리").value = safeText(row.카테고리);
  ["라인","타입","컬러","라미","면"].forEach(group => {
    const el = document.getElementById(group);
    if(el) el.value = safeText(row[group]);
  });
  buildPreviewCode();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
function resetForm(){
  document.getElementById("id").value = "";
  document.getElementById("카테고리").value = "";
  ["라인","타입","컬러","라미","면"].forEach(group => {
    const el = document.getElementById(group);
    if(el) el.value = "";
  });
  buildPreviewCode();
}
function valueOf(id){ return safeText(document.getElementById(id).value); }
function makePayload(actionName){
  return {
    action: actionName,
    id: valueOf("id"),
    카테고리: valueOf("카테고리"),
    라인: valueOf("라인"),
    타입: valueOf("타입"),
    컬러: valueOf("컬러"),
    라미: valueOf("라미"),
    면: valueOf("면")
  };
}
async function postJson(payload){
  const res = await fetch(API, { method: "POST", body: JSON.stringify(payload) });
  const text = await res.text();
  try { return JSON.parse(text); } catch { return { raw: text }; }
}
async function saveProduct(){ await postJson(makePayload("saveProduct")); alert("저장 완료"); await loadProducts(); resetForm(); }
async function updateProduct(){
  if(!valueOf("id")){ alert("수정할 상품 ID가 없어"); return; }
  await postJson(makePayload("updateProduct"));
  alert("수정 완료");
  await loadProducts();
}
async function deleteProduct(){
  if(!valueOf("id")){ alert("삭제할 상품 ID가 없어"); return; }
  if(!confirm("이 상품을 삭제할까?")) return;
  await postJson({ action: "deactivateProduct", id: valueOf("id") });
  alert("삭제 완료");
  await loadProducts();
  resetForm();
}
async function copyCode(){
  if(!state.previewCode){ alert("복사할 코드가 없어"); return; }
  await navigator.clipboard.writeText(state.previewCode);
  alert("코드 복사 완료");
}
async function copyThumbs(){
  const thumbs = thumbStrings(state.previewCode);
  if(!thumbs.length){ alert("복사할 썸네일 코드가 없어"); return; }
  await navigator.clipboard.writeText(thumbs.join("\n"));
  alert("썸네일 코드 복사 완료");
}
async function loadMeta(){
  const res = await fetch(`${API}?action=meta`);
  const json = await res.json();
  state.codeMap = Array.isArray(json.data && json.data.codeMap) ? json.data.codeMap : [];
  buildSelects();
  buildTabs();
  renderCodeTable();
  buildPreviewCode();
}
async function loadProducts(){
  const res = await fetch(`${API}?action=products`);
  const json = await res.json();
  state.products = Array.isArray(json.data) ? json.data : [];
  renderProductTable();
}
function bindEvents(){
  ["라인","타입","컬러","라미","면","카테고리"].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener("change", buildPreviewCode);
    el.addEventListener("input", buildPreviewCode);
  });
  document.getElementById("searchInput").addEventListener("input", renderCodeTable);
  document.getElementById("productSearchInput").addEventListener("input", renderProductTable);
  document.getElementById("reloadBtn").addEventListener("click", () => loadMeta().catch(showError));
  document.getElementById("reloadProductsBtn").addEventListener("click", () => loadProducts().catch(showError));
  document.getElementById("saveBtn").addEventListener("click", () => saveProduct().catch(showError));
  document.getElementById("updateBtn").addEventListener("click", () => updateProduct().catch(showError));
  document.getElementById("deleteBtn").addEventListener("click", () => deleteProduct().catch(showError));
  document.getElementById("copyCodeBtn").addEventListener("click", () => copyCode().catch(showError));
  document.getElementById("copyThumbBtn").addEventListener("click", () => copyThumbs().catch(showError));
  document.getElementById("resetBtn").addEventListener("click", resetForm);
}
function showError(err){
  setStatus("연결 실패");
  alert("오류\n" + (err && err.message ? err.message : err));
}
async function init(){
  setStatus("불러오는 중...");
  await loadMeta();
  await loadProducts();
  setStatus("연결됨", true);
}
bindEvents();
init().catch(showError);
</script>
</body>
</html>
